<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/fav.png" type="image/png" />
    <meta name="theme-color" content="#062A3B" />

    <!-- The onboarding form's URL carries a signed token that is the new
         hire's only credential. Sent as a Referer it would leak into another
         host's access log, so no request from this site ever carries one. -->
    <meta name="referrer" content="no-referrer" />

    <title>Careers at Aidapt</title>
    <meta
      name="description"
      content="Open roles at Aidapt, the operator's AI firm. Browse live positions across Operations, Intelligence and Enablement, and apply online."
    />

    <meta property="og:title" content="Careers at Aidapt" />
    <meta
      property="og:description"
      content="Open roles at Aidapt, the operator's AI firm. Browse live positions and apply online."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Overwritten per view by src/lib/seo.ts; this is what a crawler that
         does not run JavaScript sees. -->
    <link rel="canonical" href="https://aidapt.co/" />
    <meta property="og:site_name" content="Aidapt" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
