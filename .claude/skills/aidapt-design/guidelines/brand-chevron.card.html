<!-- @dsCard group="Brand" viewport="700x270" name="The chevron mark" subtitle="from > to / translation. Approved colours only — never warm. Solid + keyline." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:22px}
  .meaning{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .meaning img{height:30px}
  .meaning .txt{font:var(--fw-bold) 22px/1 var(--font-display);letter-spacing:-.01em}
  .meaning .from{color:var(--text-secondary)}
  .meaning .ar{color:var(--teal-400);font-weight:800}
  .meaning .to{color:var(--ink-900)}
  .meaning .note{margin-left:auto;font:400 12px/1.3 var(--font-sans);color:var(--text-secondary);max-width:230px;text-align:right}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .sw{width:74px;height:74px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;border:1px solid var(--border-subtle)}
  .sw img{height:34px}
  .keyline{border:var(--border-thick) solid var(--teal-400);background:var(--white)}
  .keyline span{font:var(--fw-extrabold) 34px/1 var(--font-display);color:var(--teal-400)}
  .cap{font:500 10px/1 var(--font-mono);color:var(--text-tertiary);text-align:center;margin-top:6px}
  .item{text-align:center}
</style></head><body>
  <div class="meaning">
    <span class="txt"><span class="from">EN</span> <span class="ar">&gt;</span> <span class="to">JA</span></span>
    <span class="note">The chevron always means <b>from &gt; to</b> — translation, progress. It always points forward.</span>
  </div>
  <div class="row">
    <div class="item"><div class="sw" style="background:var(--white)"><img src="../assets/logo/aidapt-chevron.png" alt="teal"></div><div class="cap">Teal</div></div>
    <div class="item"><div class="sw" style="background:var(--deepflow-900)"><img src="../assets/logo/aidapt-chevron-white.png" alt="white"></div><div class="cap">White</div></div>
    <div class="item"><div class="sw" style="background:var(--mist-50)"><img src="../assets/logo/aidapt-chevron-deepflow.png" alt="deepflow"></div><div class="cap">Deep Flow</div></div>
    <div class="item"><div class="sw" style="background:var(--deepflow-900)"><img src="../assets/logo/aidapt-chevron-cyan.png" alt="cyan"></div><div class="cap">Cyan</div></div>
    <div class="item"><div class="sw" style="background:var(--white)"><img src="../assets/logo/aidapt-chevron-ink.png" alt="ink"></div><div class="cap">Ink</div></div>
    <div class="item"><div class="sw keyline"><span>&gt;</span></div><div class="cap">Keyline</div></div>
  </div>
</body></html>
