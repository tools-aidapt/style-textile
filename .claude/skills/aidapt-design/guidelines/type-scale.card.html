<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:22px}
  .r{display:grid;grid-template-columns:1fr 132px;align-items:baseline;gap:16px;padding:9px 0;border-top:1px solid var(--border-subtle)}
  .r:first-child{border-top:none}
  .sample{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font:500 11px/1.4 var(--font-mono);color:var(--text-tertiary);text-align:right}
  .meta b{color:var(--text-secondary);font-weight:600}
</style></head><body>
  <div class="r"><div class="sample" style="font:var(--fw-extrabold) var(--fs-display)/1 var(--font-display);letter-spacing:-.022em">Complexity made calm</div><div class="meta"><b>Display</b><br>64 / 68 · 800</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-extrabold) var(--fs-h1)/1 var(--font-display);letter-spacing:-.014em">Keep your voice</div><div class="meta"><b>H1</b><br>48 / 54 · 800</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-bold) var(--fs-h2)/1 var(--font-display);letter-spacing:-.014em">Translate. Adapt.</div><div class="meta"><b>H2</b><br>38 / 44 · 700</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-bold) var(--fs-h3)/1 var(--font-display);letter-spacing:-.006em">One terminology engine</div><div class="meta"><b>H3</b><br>30 / 38 · 700</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-bold) var(--fs-h4)/1 var(--font-display);letter-spacing:-.006em">Review before it ships</div><div class="meta"><b>H4</b><br>24 / 32 · 700</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-bold) var(--fs-h5)/1 var(--font-display);letter-spacing:-.006em">Glossary &amp; memory</div><div class="meta"><b>H5</b><br>20 / 28 · 700</div></div>
  <div class="r"><div class="sample" style="font:var(--fw-bold) var(--fs-h6)/1 var(--font-display);letter-spacing:-.006em">Project settings</div><div class="meta"><b>H6</b><br>17 / 24 · 700</div></div>
</body></html>
