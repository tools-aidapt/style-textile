<!-- @dsCard group="Colors" viewport="700x320" name="Colour ratios & governance" subtitle="Moments-of-impact vs everyday mix. Water hero always present; Fire ≤5%." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);font-family:var(--font-sans);color:var(--text-primary);padding:20px}
  .blk{margin-bottom:18px}
  .blk h4{font:var(--fw-bold) 14px/1 var(--font-display);margin:0 0 9px}
  .bar{display:flex;height:38px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .seg{display:flex;align-items:center;justify-content:center;font:var(--fw-semibold) 11px/1.1 var(--font-sans);text-align:center;padding:0 4px}
  .legend{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
  .legend span{font:500 11px/1 var(--font-sans);color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  .caps{display:flex;gap:10px;margin-top:4px}
  .cap{flex:1;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:9px 11px;font:500 11.5px/1.35 var(--font-sans);color:var(--text-secondary)}
  .cap b{display:block;font:var(--fw-semibold) 12px/1.2 var(--font-sans);color:var(--text-primary);margin-bottom:2px}
</style></head><body>
  <div class="blk">
    <h4>Moments of impact</h4>
    <div class="bar">
      <div class="seg" style="flex:50;background:var(--teal-400);color:var(--ink-900)">Water 50%</div>
      <div class="seg" style="flex:30;background:var(--ink-900);color:#fff">Metal 30%</div>
      <div class="seg" style="flex:10;background:var(--spring-300);color:var(--ink-900)">Wood 10</div>
      <div class="seg" style="flex:5;background:var(--sand-200);color:var(--ink-900)">Earth</div>
      <div class="seg" style="flex:5;background:var(--ember-300);color:var(--ink-900)">Fire</div>
    </div>
  </div>
  <div class="blk">
    <h4>Everyday</h4>
    <div class="bar">
      <div class="seg" style="flex:55;background:var(--mist-50);color:var(--ink-900)">Metal 55%</div>
      <div class="seg" style="flex:30;background:var(--teal-400);color:var(--ink-900)">Water 30%</div>
      <div class="seg" style="flex:10;background:var(--spring-300);color:var(--ink-900)">Wood 10</div>
      <div class="seg" style="flex:5;background:var(--ember-300);color:var(--ink-900)">Fire</div>
    </div>
  </div>
  <div class="caps">
    <div class="cap"><b>Water always present</b>A Water hero anchors every layout.</div>
    <div class="cap"><b>White stays generous</b>Lead with white; whitespace is the loudest material.</div>
    <div class="cap"><b>Fire ≤ 5%</b>Ember marks the one action that matters — never decorates.</div>
  </div>
</body></html>
