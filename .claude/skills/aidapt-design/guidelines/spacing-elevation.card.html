<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation / shadows" subtitle="Quiet depth, tinted to Deep Flow rgba(6,42,59) — never neutral grey/black." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:26px 22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .item{text-align:center}
  .box{width:92px;height:64px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border-subtle)}
  .nm{font:var(--fw-semibold) 12px/1 var(--font-mono);margin-top:14px;color:var(--text-secondary)}
  .teal{border:none}
</style></head><body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="nm">xs</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm · cards</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="nm">xl · modals</div></div>
  <div class="item"><div class="box teal" style="background:var(--teal-400);box-shadow:var(--shadow-teal)"></div><div class="nm">teal glow</div></div>
</body></html>
