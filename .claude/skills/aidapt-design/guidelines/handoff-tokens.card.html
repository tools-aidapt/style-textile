    document.getElementById('pre-css').textContent=raw.css;
    document.getElementById('pre-json').textContent=raw.json;
    function show(w){cur=w;
      document.getElementById('pane-css').classList.toggle('on',w==='css');
      document.getElementById('pane-json').classList.toggle('on',w==='json');
      document.getElementById('b-css').classList.toggle('on',w==='css');
      document.getElementById('b-json').classList.toggle('on',w==='json');}
    function copyCur(){var b=document.getElementById('copy');
      navigator.clipboard&&navigator.clipboard.writeText(raw[cur]).then(function(){
        b.classList.add('done');b.lastChild.textContent=' Copied';
        setTimeout(function(){b.classList.remove('done');b.lastChild.textContent=' Copy';},1500);});}
