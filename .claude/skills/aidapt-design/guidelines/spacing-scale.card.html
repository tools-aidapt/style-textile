<!-- @dsCard group="Spacing" viewport="700x360" name="Spacing scale" subtitle="4px base, 8px rhythm. Whitespace is the loudest material — choose the larger step." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:20px}
  .r{display:grid;grid-template-columns:90px 64px 1fr;align-items:center;gap:14px;padding:4px 0}
  .tok{font:500 12px/1 var(--font-mono);color:var(--text-primary)}
  .px{font:500 12px/1 var(--font-mono);color:var(--text-tertiary);text-align:right}
  .bar{height:14px;background:var(--teal-400);border-radius:var(--radius-xs)}
</style></head><body>
  <div class="r"><span class="tok">--space-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="tok">--space-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="tok">--space-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="r"><span class="tok">--space-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="tok">--space-6</span><span class="px">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="tok">--space-8</span><span class="px">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="tok">--space-12</span><span class="px">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="tok">--space-16</span><span class="px">64px</span><div class="bar" style="width:64px"></div></div>
  <div class="r"><span class="tok">--space-20</span><span class="px">80px</span><div class="bar" style="width:80px"></div></div>
  <div class="r"><span class="tok">--space-24</span><span class="px">96px</span><div class="bar" style="width:96px"></div></div>
  <div class="r"><span class="tok">--space-32</span><span class="px">128px</span><div class="bar" style="width:128px"></div></div>
</body></html>
