<!-- @dsCard group="Patterns" viewport="700x360" name="Gradient hero + Ember CTA" subtitle="Cropped teal-led flow mesh, film grain, one Water headline, a single Ember CTA" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{margin:0;background:var(--deepflow-900)}
  .hero{position:relative;min-height:360px;background:var(--grad-mesh-dark);overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;padding:48px 52px;box-sizing:border-box;isolation:isolate}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:var(--grain);background-size:200px 200px;mix-blend-mode:soft-light;opacity:.85}
  .hero > *{position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font:600 12px/1 var(--font-sans);letter-spacing:var(--ls-wider);
    text-transform:uppercase;color:var(--cyan-300);margin:0 0 18px}
  .eyebrow img{height:14px}
  h1{font:var(--fw-extrabold) 46px/1.04 var(--font-display);letter-spacing:-.022em;color:#fff;margin:0;max-width:15ch}
  h1 .hl{color:var(--cyan-300)}
  p.sub{font:400 17px/1.5 var(--font-sans);color:var(--deepflow-100);margin:18px 0 0;max-width:46ch}
  .cta{margin-top:30px;display:flex;gap:14px;align-items:center}
</style></head><body>
  <div class="hero">
    <p class="eyebrow"><img src="../assets/logo/aidapt-chevron-cyan.png" alt="">AI translation, made calm</p>
    <h1>Keep your voice in <span class="hl">every market</span></h1>
    <p class="sub">One terminology engine. 120+ languages. Translations that read like you wrote them — reviewed, adapted, and on-brand.</p>
    <div class="cta" id="cta"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button } = window.AidaptDesignSystem_0090ec;
    const Arrow = () => (<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>);
    function CTA(){
      return (<>
        <Button variant="cta" iconRight={<Arrow/>}>Start a project</Button>
        <a href="#" style={{color:'#fff',font:'600 15px/1 var(--font-sans)',textDecoration:'none',
          display:'inline-flex',alignItems:'center',gap:'7px',padding:'12px 6px',borderBottom:'2px solid var(--cyan-300)'}}>See how it works</a>
      </>);
    }
    ReactDOM.createRoot(document.getElementById('cta')).render(<CTA/>);
  </script>
</body></html>
