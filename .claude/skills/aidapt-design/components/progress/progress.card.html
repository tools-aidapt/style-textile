<!-- @dsCard group="Components" viewport="700x300" name="Progress, spinners & skeletons" subtitle="Linear progress, ring spinners, and shimmer skeletons" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:22px}
  .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:16px}
  .ttl{font:600 11px/1 var(--font-sans);letter-spacing:var(--ls-wider);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}
  .spinners{display:flex;align-items:center;gap:18px}
  .ondark{background:var(--deepflow-900);border-radius:var(--radius-md);padding:10px 14px;display:inline-flex;gap:14px;align-items:center}
  .skelcard{border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px}
  .skelrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}
</style></head><body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Progress, Spinner, Skeleton, Avatar } = window.AidaptDesignSystem_0090ec;
    function Demo(){
      return (
        <div className="cols">
          <div>
            <div className="ttl">Progress</div>
            <div className="stack">
              <Progress value={72} label="Translating · German" showValue />
              <Progress value={40} variant="success" label="Review" showValue />
              <Progress indeterminate label="Syncing memory" />
              <div>
                <div className="ttl" style={{marginTop:'4px'}}>Spinners</div>
                <div className="spinners">
                  <Spinner size="xs" /><Spinner size="sm" /><Spinner size="md" /><Spinner size="lg" />
                  <span className="ondark"><Spinner size="sm" onDark /><Spinner size="md" onDark /></span>
                </div>
              </div>
            </div>
          </div>
          <div>
            <div className="ttl">Skeleton</div>
            <div className="skelcard">
              <div className="skelrow">
                <Skeleton variant="circle" width={40} height={40} />
                <div style={{flex:1}}><Skeleton variant="text" width="60%" /><Skeleton variant="text" width="40%" /></div>
              </div>
              <Skeleton variant="rect" height={72} />
              <div style={{marginTop:'12px'}}><Skeleton variant="text" lines={3} /></div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
