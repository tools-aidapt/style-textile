<!-- @dsCard group="Components" viewport="700x300" name="Tabs, breadcrumbs & pagination" subtitle="In-page navigation — chevron breadcrumb trail, underlined tabs, truncating pagination" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--white);color:var(--text-primary);padding:22px}
  .ttl{font:600 11px/1 var(--font-sans);letter-spacing:var(--ls-wider);text-transform:uppercase;color:var(--text-tertiary);margin:0 0 12px}
  .blk{margin-bottom:26px}
  .blk:last-child{margin-bottom:0}
</style></head><body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Tabs, Breadcrumbs, Pagination } = window.AidaptDesignSystem_0090ec;
    function Demo(){
      const [tab,setTab]=React.useState('review');
      const [page,setPage]=React.useState(3);
      return (
        <div>
          <div className="blk">
            <div className="ttl">Breadcrumbs</div>
            <Breadcrumbs items={[{label:'Projects',href:'#'},{label:'Spring launch',href:'#'},{label:'German draft'}]}/>
          </div>
          <div className="blk">
            <div className="ttl">Tabs</div>
            <Tabs value={tab} onChange={setTab} tabs={[
              {id:'all',label:'All segments',count:128},
              {id:'review',label:'In review',count:4},
              {id:'done',label:'Approved'},
              {id:'archived',label:'Archived',disabled:true},
            ]}/>
          </div>
          <div className="blk">
            <div className="ttl">Pagination</div>
            <Pagination page={page} total={24} onChange={setPage} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
