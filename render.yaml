# Render ignores public/_redirects (that is Netlify/Cloudflare syntax). Deep links
# like /requisitions/new must be rewritten to the SPA shell here, or the host 404s
# before React Router ever runs.
services:
  - type: web
    runtime: static
    name: hr-kenafric
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
